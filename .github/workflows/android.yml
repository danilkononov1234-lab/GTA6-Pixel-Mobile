name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Prepare Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/tmp/android-licenses.log || true
      - name: Configure Android
        run: |
          mkdir -p ~/.android ~/.config/godot build
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"
          adb start-server
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME" > ~/.config/godot/editor_settings-4.4.tres
      - name: Export APK
        run: |
          godot --headless --editor --import --path . --quit
          adb start-server
          ls -l ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          ls -l "$ANDROID_HOME/build-tools"
          godot --headless --path . --export-pack Android build/game.zip
          mkdir -p /tmp/apkwork/assets
          unzip -q build/game.zip -d /tmp/apkwork/assets
          test -s /tmp/apkwork/assets/project.binary
          cp ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk /tmp/apkwork/raw.apk
          cd /tmp/apkwork
          zip -d raw.apk 'META-INF/*' || true
          zip -0 -r raw.apk assets
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 raw.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$GITHUB_WORKSPACE/build/Leonida.apk" aligned.apk
          cd "$GITHUB_WORKSPACE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/Leonida.apk
          test -s build/Leonida.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Leonida-Android
          path: build/Leonida.apk
